spring:
  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/url_shortener?generateSimpleParameterMetadata=true&zeroDateTimeBehavior=convertToNull&verifyServerCertificate=false&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  hikari:
    connection-timeout: 60000
    idle-timeout: 300000
    max-lifetime: 900000
    maximum-pool-size: ${MAX_POOL_SIZE}
    minimum-idle: 5
    validation-timeout: 5000
    pool-name: url-shortener-${random.shortuuid}
    connection-test-query: select 1 from dual
    transaction-isolation: TRANSACTION_READ_COMMITTED
    leak-detection-threshold: 30000
    connection-init-sql: select 1 from dual
    initialization-fail-fast: false
    data-source-properties:
      cachePrepStmts: true
      prepStmtCacheSize: 250
      prepStmtCacheSqlLimit: 2048
      useServerPrepStmts: true
      useLocalSessionState: true
      rewriteBatchedStatements: true
      cacheResultSetMetadata: true
      cacheServerConfiguration: true
      elideSetAutoCommits: true
      maintainTimeStats: false

server:
  port: 8080
  tomcat:
    protocol: org.apache.coyote.http11.Http11NioProtocol
    max-threads: ${MGAUTH_SRV_MAX_THREADS}
    accept-count: 100
    connection-timeout: 20000
    compression:
      enabled: true
      min-size: 1024
      no-compression-user-agents: gozilla, traviata
      compressable-mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    threads:
      max: 150
      min-spare: 4
      max-idle-time: 60000

logging:
  file:
    name: logs/urlshortener.log

  rollingpolicy:
    file-name-pattern: "logs/urlshortener.%d{yyyy-MM-dd}.%i.log"
    max-file-size: 10MB
    max-history: 7